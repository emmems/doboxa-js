openapi: 3.0.0
info:
  title: API V2
  description: API V2
  version: 1.0-alpha
paths:
  /api/v2/authentication/token:
    post:
      tags:
        - Authentication
      description: Retrieve a JWT token using your username and password
      operationId: null
      requestBody:
        description: Username and password
        required: true
        content:
          application/json:
            schema:
              properties:
                username:
                  type: string
                password:
                  type: string
              type: object
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                properties:
                  token:
                    description: JWT token, valid for 3600 seconds (1 hour)
                    type: string
                  refresh_token:
                    description: Refresh token, valid for 2592000 seconds (30 days)
                    type: string
                type: object
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: int
                    example: 401
                  message:
                    type: string
                    example: Bad credentials
                type: object
  /api/v2/authentication/refresh_token:
    post:
      tags:
        - Authentication
      description: Retrieve a new valid JWT token using refresh token. Refresh token
        lifetime will be reset
      operationId: null
      requestBody:
        description: Refresh token
        required: true
        content:
          application/json:
            schema:
              properties:
                refresh_token:
                  type: string
              type: object
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                properties:
                  token:
                    type: string
                  refresh_token:
                    type: string
                type: object
        "401":
          description: Bad credentials
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: int
                    example: 401
                  message:
                    type: string
                    example: Bad credentials
                type: object
  /api/v2/client:
    get:
      tags:
        - Client
      summary: Get clients (only commission type)
      operationId: get_app_ecommerce_api_v2_getclients__invoke
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            example: "1"
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfClients"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/discount_code:
    get:
      tags:
        - Discount code
      summary: Get discount codes (only commission type)
      operationId: get_api_v2_discount_codes_external
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            example: "1"
      responses:
        "200":
          description: Returned paginated discount codes
          content:
            application/json:
              schema:
                properties:
                  items:
                    type: array
                    items:
                      properties:
                        code:
                          description: Discount code
                          type: string
                        type:
                          description: Discount type
                          type: string
                        client_email:
                          description: Client associated with the discount
                          type: string
                        domain:
                          description: Domain associated with the discount
                          type: string
                        currency:
                          description: Discount currency
                          type: string
                          nullable: true
                        action:
                          description: Discount amount
                          type: string
                        valid_until:
                          description: Discount expiration time
                          type: string
                          nullable: true
                      type: object
                  next_page:
                    description: Link to the next page of results
                    type: string
                    nullable: true
                type: object
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/invoice/{invoice_id}:
    get:
      tags:
        - Invoice
      summary: Get a specific invoice
      operationId: get_app_ecommerce_api_v2_getinvoice__invoke
      parameters:
        - name: invoice_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/invoice:
    get:
      tags:
        - Invoice
      summary: Get latest invoices
      operationId: get_app_ecommerce_api_v2_getinvoices__invoke
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            example: "1"
        - name: from
          in: query
          description: "Invoices added after given time. Default: now - 1 day"
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "Invoices added before given time. Default: now"
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfInvoices"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/user/me:
    get:
      tags:
        - User
      summary: Validate your access token
      operationId: get_app_ecommerce_api_v2_getme__invoke
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order/{order_id}/comment:
    get:
      tags:
        - Order
      summary: Get a specific order comments
      operationId: get_app_ecommerce_api_v2_getordercomments__invoke
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of order comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfOrderComments"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
    post:
      tags:
        - Order
      summary: Create an Order comment
      operationId: post_app_ecommerce_api_v2_postordercomment__invoke
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderComment"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostOrderCommentResponse"
        "400":
          description: Invalid data found in the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order/{order_id}/invoice:
    get:
      tags:
        - Order
      summary: Get Order invoices
      operationId: get_app_ecommerce_api_v2_getorderinvoices__invoke
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfInvoices"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order/{order_id}/status:
    get:
      tags:
        - Order
      summary: Get current order status
      operationId: get_app_ecommerce_api_v2_getorderstatus__invoke
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
    post:
      tags:
        - Order
      summary: Change Order status (only commision type or test orders)
      operationId: post_app_ecommerce_api_v2_postorderstatuschange__invoke
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostOrderStatus"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostOrderStatusResponse"
        "400":
          description: Invalid data found in the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order_status_change:
    get:
      tags:
        - Order Status Change
      summary: Get latest status changes. Note that only the latest order status
        change is provided.
      operationId: get_app_ecommerce_api_v2_getorderstatuschanges__invoke
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            example: "1"
        - name: from
          in: query
          description: "Order status changes newer than given time. Default: now - 4 hours"
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "Order status changes older than given time. Default: now"
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of order status changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfOrderStatusChanges"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order/{order_id}/tracking_number:
    get:
      tags:
        - Order
      summary: Get Order tracking numbers
      operationId: get_app_ecommerce_api_v2_getordertrackingnumbers__invoke
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of order tracking numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfTrackingNumbers"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order_comment:
    get:
      tags:
        - Order Comment
      summary: Get latest order comments.
      operationId: get_app_ecommerce_api_v2_getorderscomments__invoke
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            example: "1"
        - name: from
          in: query
          description: "Comments added after given time. Default: now - 4 hours"
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "Comments added before given time. Default: now"
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of latest orders comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfOrderComments"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/tracking_number:
    get:
      tags:
        - Tracking Number
      summary: Get latest tracking numbers
      operationId: get_app_ecommerce_api_v2_gettrackingnumbers__invoke
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            example: "1"
        - name: from
          in: query
          description: "Tracking numbers added after given time. Default: now - 1 day"
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "Tracking numbers added before given time. Default: now"
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of tracking numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfTrackingNumbers"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order:
    post:
      tags:
        - Order
      summary: Create an Order
      operationId: post_app_ecommerce_api_v2_postorder__invoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostOrderResponse"
        "400":
          description: Invalid data found in the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
  /api/v2/order_cancellation:
    post:
      tags:
        - Order Cancellation
      summary: Cancel an order if possible (orders already in production cannot be
        cancelled)
      operationId: post_app_ecommerce_api_v2_postordercancellation__invoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancellation"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCancellationResponse"
        "400":
          description: Invalid data found in the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "401":
          description: Not authorized for this resource
        "403":
          description: Access token expired
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequestDataResponse"
        "422":
          description: Order cancellation cannot be processed due to order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCancellationResponse"
        "500":
          description: Error while processing the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorResponse"
components:
  schemas:
    PageOfClients:
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        next_page:
          type: string
          nullable: true
      type: object
    InvalidRequestDataResponse:
      properties:
        invalid_parameters:
          type: array
          items:
            $ref: "#/components/schemas/InvalidParameter"
        result_code:
          description: HTTP status code
          type: integer
          example: 400
          nullable: false
        error_message:
          description: Error summary, in case of errors. Sometimes invalid_parameters may
            be empty!
          type: string
          example: Invalid parameters in the request
          nullable: false
      type: object
    ServerErrorResponse:
      properties:
        result_code:
          description: HTTP status code
          type: integer
          example: 500
          nullable: false
        error_message:
          description: Error summary
          type: string
          example: Internal Server Error
          nullable: true
      type: object
    Invoice:
      properties:
        id:
          description: Invoice id
          type: string
          example: "123456789"
          nullable: false
        client:
          description: Client owning the Invoice
          type: string
          example: client@mail.com
          nullable: false
        file:
          description: Direct link to Invoice PDF file
          type: string
          example: https://pl.doboxa.biz/documents/invoices/abc123/invoice_file.pdf
          nullable: false
        state:
          description: Invoice payment status
          type: string
          enum:
            - PAID
            - UNPAID
          nullable: false
        document_number:
          description: Invoice number
          type: string
          example: FAV/2023/11/23
          nullable: false
        document_amount:
          description: Amount to pay
          type: integer
          example: 12300
          nullable: false
        net_amount:
          description: Net amount
          type: integer
          example: 10000
          nullable: false
        tax_amount:
          description: Tax amount
          type: integer
          example: 2300
          nullable: false
        tax_rate:
          description: Tax rate
          type: string
          example: "23.5"
          nullable: true
        paid_amount:
          description: Amount already paid
          type: integer
          example: 0
          nullable: false
        currency:
          description: Currency
          type: string
          example: PLN
          nullable: false
        date_of_issue:
          description: Date of issue
          type: string
          format: date-time
          nullable: false
        due_date:
          description: Due date
          type: string
          format: date-time
          nullable: false
        document_type:
          description: Document type
          type: string
          enum:
            - main
          nullable: false
        orders:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceOrder"
        invoice_items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"
      type: object
    PageOfInvoices:
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        next_page:
          type: string
          nullable: true
      type: object
    Me:
      properties:
        username:
          type: string
      type: object
    PageOfOrderComments:
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderComment"
        next_page:
          type: string
          nullable: true
      type: object
    CreateOrderComment:
      required:
        - author_type
        - author_email
        - content
        - created_at
      properties:
        author_type:
          description: Author type
          type: string
          enum:
            - client
            - support
          nullable: false
        author_email:
          description: Author type
          type: string
          example: mail@mail.com
          nullable: false
        content:
          description: Comment content
          type: string
          example: Comment content
          nullable: false
        created_at:
          description: Comment creation time
          type: string
          format: date-time
          nullable: false
      type: object
    PostOrderCommentResponse:
      properties:
        result_code:
          description: HTTP status code
          type: integer
          example: 200
          nullable: false
        comment_id:
          description: Comment id, if successfully created
          type: string
          example: "123456"
          nullable: false
      type: object
    OrderStatus:
      properties:
        status:
          description: Order status
          type: string
          enum:
            - new
            - wait_for_payment
            - paid
            - in_progress
            - ready_to_be_sent
            - sent
            - cancelled
            - hold
            - refund
          nullable: false
        item_status:
          description: Order items status
          type: array
          items:
            $ref: "#/components/schemas/OrderItemStatus"
          nullable: false
      type: object
    PostOrderStatus:
      required:
        - status
      properties:
        status:
          description: Order status
          type: string
          enum:
            - new
            - wait_for_payment
            - paid
            - in_progress
            - ready_to_be_sent
            - sent
            - cancelled
            - hold
            - refund
          nullable: false
        item_status:
          description: Order items status. If any item is not specified, its status will
            be changed to order status
          type: array
          items:
            $ref: "#/components/schemas/PostOrderStatusItem"
          nullable: true
      type: object
    PostOrderStatusResponse:
      properties:
        result_code:
          description: HTTP status code
          type: integer
          example: 200
          nullable: false
      type: object
    PageOfOrderStatusChanges:
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderStatusChange"
        next_page:
          type: string
          nullable: true
